[workspace]
resolver = "3"
members = [
    "apps/desktop/src-tauri",
    "crates/stay-core",
    "crates/stay-e2e",
    "crates/stay-platform",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/avatarneil/Stay"
rust-version = "1.90"
version = "0.1.0"

[workspace.dependencies]
active-win-pos-rs = "0.10.1"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tauri = "2.11.1"
tauri-build = "2.6.1"
thiserror = "2.0.18"
